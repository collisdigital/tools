<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suits "Goddamn" HD Soundboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Comic Neue', cursive;
            background-color: #fef3c7; /* Amber-100 */
            background-image: radial-gradient(#fbbf24 2px, transparent 2px);
            background-size: 30px 30px;
        }

        h1, h2, .bangers-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
        }

        .character-card {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
        }

        .character-card:active {
            transform: scale(0.95) rotate(-2deg);
        }

        .character-card:hover {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Animation for speaking */
        @keyframes jaw-move {
            0% { height: 10px; }
            50% { height: 25px; }
            100% { height: 10px; }
        }

        .playing .mouth-open {
            animation: jaw-move 0.2s infinite;
        }
        
        .playing {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }

        .comic-shadow {
            box-shadow: 5px 5px 0px black;
        }
        
        .bubble {
            position: absolute;
            background: #fff;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 5px 10px;
            top: -15px;
            right: -10px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 20;
            font-family: 'Bangers', cursive;
            color: #ef4444;
        }
        
        .playing .bubble {
            opacity: 1;
            transform: scale(1) rotate(10deg);
        }

        /* Counter Styles */
        .counter-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            background: #fff;
            border: 3px solid #000;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.8);
            transform: rotate(-5deg);
            transition: transform 0.1s;
        }

        .counter-label {
            font-family: 'Comic Neue', cursive;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            line-height: 1;
        }

        .counter-value {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            line-height: 1;
            color: #ef4444;
        }

        @keyframes pump {
            0% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.2) rotate(0deg); }
            100% { transform: scale(1) rotate(-5deg); }
        }

        .pump-animation {
            animation: pump 0.2s ease-out;
        }

        /* Mobile adjustment for counter to not block content */
        @media (max-width: 640px) {
            .counter-container {
                width: 80px;
                height: 80px;
                bottom: 10px;
                right: 10px;
            }
            .counter-value {
                font-size: 2rem;
            }
        }
    </style>
</head>

                </svg>`
        };

        const characters = [
            { name: "Harvey", role: "The Closer", color: "bg-green-200", pitch: 0.7, rate: 1.1, svg: svgs.harvey },
            { name: "Mike", role: "The Fraud", color: "bg-blue-200", pitch: 1.2, rate: 1.3, svg: svgs.mike },
            { name: "Louis", role: "The Litt", color: "bg-purple-200", pitch: 1.6, rate: 1.4, svg: svgs.louis },
            { name: "Donna", role: "The COO", color: "bg-red-200", pitch: 1.1, rate: 1.0, svg: svgs.donna },
            { name: "Jessica", role: "Managing Partner", color: "bg-yellow-200", pitch: 0.9, rate: 0.9, svg: svgs.jessica },
            { name: "Rachel", role: "Paralegal", color: "bg-pink-200", pitch: 1.3, rate: 1.1, svg: svgs.rachel }
        ];

        const board = document.getElementById('board');
        const synth = window.speechSynthesis;

        // Settings Elements
        const hackTrigger = document.getElementById('hack-trigger');
        const hackPanel = document.getElementById('hack-panel');
        const voiceSelect = document.getElementById('voice-select');
        const textInput = document.getElementById('text-input');
        const resetBtn = document.getElementById('reset-btn');

        // State
        let customVoiceName = localStorage.getItem('goddamn-voice');
        let customTextPhrase = localStorage.getItem('goddamn-text');

        // Counter Logic
        let goddamnCount = 0;
        const counterElement = document.getElementById('goddamn-counter');
        const counterValueElement = document.getElementById('goddamn-count-value');

        function createBoard() {
            characters.forEach(char => {
                const card = document.createElement('div');
                card.className = `character-card relative cursor-pointer border-4 border-black rounded-3xl p-4 flex flex-col items-center ${char.color} comic-shadow select-none`;
                
                card.innerHTML = `
                    <div class="bubble text-xl font-black">GODDAMN!</div>
                    <div class="w-32 h-32 md:w-40 md:h-40 bg-white border-2 border-black rounded-full overflow-hidden mb-4 relative z-0 shadow-inner">
                        ${char.svg}
                    </div>
                    <h3 class="bangers-font text-3xl mb-1">${char.name}</h3>
                    <p class="font-bold text-xs uppercase tracking-widest bg-black text-white px-2 py-1 rounded-lg transform -rotate-1">${char.role}</p>
                `;

                card.addEventListener('click', () => playSound(char, card));
                board.appendChild(card);
            });
        }

        function populateVoiceList() {
            if (typeof synth === 'undefined') return;

            const voices = synth.getVoices().sort((a, b) => {
                const aname = a.name.toUpperCase();
                const bname = b.name.toUpperCase();
                if (aname < bname) return -1;
                else if (aname == bname) return 0;
                return +1;
            });

            voiceSelect.innerHTML = '';

            // Add default option
            const defaultOption = document.createElement('option');
            defaultOption.textContent = 'Default (Auto-detect)';
            defaultOption.value = '';
            voiceSelect.appendChild(defaultOption);

            for (let i = 0; i < voices.length; i++) {
                const option = document.createElement('option');
                option.textContent = `${voices[i].name} (${voices[i].lang})`;
                option.value = voices[i].name;

                if (voices[i].default) {
                    option.textContent += ' -- DEFAULT';
                }

                if (customVoiceName === voices[i].name) {
                    option.selected = true;
                }

                voiceSelect.appendChild(option);
            }
        }

        function setupSettings() {
            // Restore text
            if (customTextPhrase) {
                textInput.value = customTextPhrase;
            }

            // Toggle Panel
            hackTrigger.addEventListener('click', () => {
                hackPanel.classList.toggle('hidden');
            });

            // Voice Change
            voiceSelect.addEventListener('change', () => {
                const selected = voiceSelect.value;
                if (selected) {
                    customVoiceName = selected;
                    localStorage.setItem('goddamn-voice', selected);

                    // Preview
                    if (synth.speaking) synth.cancel();
                    const text = customTextPhrase || "God damn!";
                    const utterThis = new SpeechSynthesisUtterance(text);
                    const voice = synth.getVoices().find(v => v.name === selected);
                    if (voice) utterThis.voice = voice;
                    synth.speak(utterThis);
                } else {
                    customVoiceName = null;
                    localStorage.removeItem('goddamn-voice');
                }
            });

            // Text Change
            textInput.addEventListener('input', () => {
                const val = textInput.value;
                customTextPhrase = val;
                localStorage.setItem('goddamn-text', val);
            });

            // Reset
            resetBtn.addEventListener('click', () => {
                localStorage.removeItem('goddamn-voice');
                localStorage.removeItem('goddamn-text');
                customVoiceName = null;
                customTextPhrase = null;

                textInput.value = "Goddamn!";
                voiceSelect.value = '';

                // Close panel if you want, but user might want to verify reset
                // hackPanel.classList.add('hidden');
            });
        }

        function playSound(char, cardElement) {
            // Animation Trigger
            cardElement.classList.remove('playing');
            void cardElement.offsetWidth; // trigger reflow
            cardElement.classList.add('playing');
            
            setTimeout(() => {
                cardElement.classList.remove('playing');
            }, 500);

            // Increment Counter
            goddamnCount++;
            counterValueElement.textContent = goddamnCount;

            counterElement.classList.remove('pump-animation');
            void counterElement.offsetWidth; // trigger reflow
            counterElement.classList.add('pump-animation');

            // Audio Logic
            if (synth.speaking) {
                synth.cancel(); 
            }

            // Determine text to speak
            const textToSpeak = customTextPhrase || "God damn!";
            const utterThis = new SpeechSynthesisUtterance(textToSpeak);

            // Keep pitch/rate from character
            utterThis.pitch = char.pitch;
            utterThis.rate = char.rate;
            utterThis.volume = 1;

            const voices = synth.getVoices();
            let preferredVoice;

            // Voice selection logic
            if (customVoiceName) {
                preferredVoice = voices.find(v => v.name === customVoiceName);
            }

            // Fallback / Default logic
            if (!preferredVoice) {
                preferredVoice = voices.find(v => v.name.includes("Google US English")) ||
                                 voices.find(v => v.lang === "en-US") ||
                                 voices.find(v => v.lang.startsWith("en"));
            }
            
            if (preferredVoice) utterThis.voice = preferredVoice;

            synth.speak(utterThis);
        }

        // Init
        window.onload = () => {
            createBoard();
            setupSettings();

            // Populate voices
            populateVoiceList();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = populateVoiceList;
            }
        };
    </script>
