<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sourdough Pro Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .stage-active { border-color: #f59e0b; background-color: #fffbeb; }
        .stage-completed { border-color: #10b981; background-color: #f0fdf4; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800 p-4 pb-12">

    <div class="max-w-md mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 pt-4">
            <div>
                <h1 class="text-2xl font-bold text-stone-900">🥖 Sourdough Pro</h1>
                <p class="text-sm text-stone-500">Track your dough lifecycle</p>
            </div>
            <button onclick="resetAll()" class="bg-red-50 text-red-600 px-3 py-2 rounded-lg text-sm font-semibold hover:bg-red-100 transition-colors">
                Reset
            </button>
        </header>

        <!-- Main Dashboard Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden mb-6">
            <!-- Total Timer Section -->
            <div class="p-6 text-center border-b border-stone-100">
                <div class="mb-4 h-8 flex items-center justify-center">
                    <div id="loaf-name-view" class="flex items-center gap-2 group">
                        <h2 id="loaf-name-display" class="text-xl font-bold text-stone-800">Sourdough Loaf</h2>
                        <button onclick="toggleNameEdit()" class="p-1 hover:bg-stone-100 rounded text-stone-400 hover:text-stone-600 transition-colors" title="Edit Loaf Name">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                    </div>
                    <input id="loaf-name-input" type="text" aria-label="Edit loaf name" class="hidden w-2/3 border-b-2 border-amber-500 focus:outline-none text-xl font-bold text-center text-stone-800 bg-transparent" onblur="saveName()" onkeydown="handleNameKey(event)" />
                </div>
                <span class="text-xs font-bold uppercase tracking-wider text-stone-400">Total Process Time</span>
                <div id="total-clock" class="text-5xl font-mono font-bold text-stone-800 mt-1">00:00:00</div>
            </div>
            
            <!-- Active Stage Section -->
            <div id="active-stage-card" class="bg-amber-50/50 p-4 flex flex-col items-center justify-center transition-all">
                <span id="active-label" class="text-[10px] font-bold uppercase tracking-widest text-amber-600">Active Stage</span>
                <div id="active-name" class="text-lg font-bold text-stone-800">Waiting to start...</div>
                <div id="active-duration" class="text-2xl font-mono font-semibold text-amber-700">00:00:00</div>
            </div>
        </div>

        <!-- Stages List -->
        <div id="stages-container" class="space-y-3">
            <!-- Stages will be injected here -->
        </div>

        <!-- Export Button -->
        <button id="copy-btn" onclick="copyToClipboard()" class="w-full bg-stone-100 text-stone-600 hover:bg-stone-200 py-3 rounded-xl font-bold transition-colors mt-6 mb-2">
            Copy to clipboard
        </button>

        <!-- Helpful Tip -->
        <footer class="mt-8 text-center text-xs text-stone-400">
            Progress is saved automatically to your browser.
        </footer>
    </div>

    <!-- UI Modal for Reset Confirmation -->
    <div id="reset-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-xs w-full shadow-xl">
            <h3 class="text-lg font-bold mb-2">Reset Tracker?</h3>
            <p class="text-stone-500 text-sm mb-6">This will clear all timestamps and counters for the current loaf.</p>
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 py-2 text-stone-600 font-semibold">Cancel</button>
                <button onclick="confirmReset()" class="flex-1 py-2 bg-red-600 text-white rounded-lg font-semibold">Reset</button>
            </div>
        </div>
    </div>

    <!-- UI Modal for Edit Time -->
    <div id="edit-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full shadow-xl">
            <h3 class="text-lg font-bold mb-4">Edit Completion Time</h3>
            <div class="mb-4">
                <input type="datetime-local" id="edit-time-input" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-stone-800 focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div id="edit-error" class="text-red-600 text-xs mb-4 hidden"></div>
            <div class="flex gap-3">
                <button onclick="closeEditModal()" class="flex-1 py-2 text-stone-600 font-semibold">Cancel</button>
                <button onclick="saveEdit()" class="flex-1 py-2 bg-amber-500 text-white rounded-lg font-semibold">Save</button>
            </div>
        </div>
    </div>

    <script>
        const STAGES_CONFIG = [
            { id: 'feed', name: 'Feed Starter', icon: '🍶', isAnchor: true },
            { id: 'levain', name: 'Levain', icon: '🧪' },
            { id: 'autolyse', name: 'Autolyse', icon: '🥣' },
            { id: 'folds', name: 'Stretch & Fold', icon: '🤲', hasCounter: true },
            { id: 'bulk', name: 'Bulk Ferment', icon: '🌋' },
            { id: 'cold', name: 'Cold Retard', icon: '❄️' },
            { id: 'bake', name: 'Bake', icon: '🔥' },
            { id: 'cool', name: 'Cooling', icon: '🌬️' }
        ];

        let state = {
            startTime: null,
            stages: {},
            loafName: "Sourdough Loaf"
        };

        let editingStageId = null;

        function loadData() {
            const saved = localStorage.getItem('sourdough_tracker_state');
            if (saved) {
                state = JSON.parse(saved);
                if (!state.loafName) state.loafName = "Sourdough Loaf";
            } else {
                initNewState();
            }
        }

        function initNewState() {
            state.startTime = null;
            STAGES_CONFIG.forEach(s => {
                state.stages[s.id] = { completed: false, timestamp: null, folds: 0 };
            });
            if (typeof state.loafName === 'undefined') state.loafName = "Sourdough Loaf";
        }

        function saveData() {
            localStorage.setItem('sourdough_tracker_state', JSON.stringify(state));
        }

        function formatDuration(ms) {
            if (!ms || ms < 0) return "00:00:00";
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return [hours, minutes, seconds].map(v => String(v).padStart(2, '0')).join(':');
        }

        function formatDurationHM(ms) {
            if (!ms || ms < 0) return "00:00";
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            return [hours, minutes].map(v => String(v).padStart(2, '0')).join(':');
        }

        function formatIsoDate(timestamp) {
            if (!timestamp) return "";
            const d = new Date(timestamp);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        }

        function generateMarkdown() {
            let markdown = `# ${state.loafName || "Sourdough Loaf"}\n\n`;
            let totalTime = 0;
            const now = Date.now();

            if (state.startTime) {
                const isFinished = state.stages['cool'].completed;
                const endTime = isFinished ? state.stages['cool'].timestamp : now;
                totalTime = endTime - state.startTime;
            }

            STAGES_CONFIG.forEach((config, index) => {
                const stageData = state.stages[config.id];
                const prevStageConfig = STAGES_CONFIG[index - 1];
                const prevStageData = prevStageConfig ? state.stages[prevStageConfig.id] : null;

                let line = `${index + 1}. ${config.name}: `;

                if (stageData.completed && stageData.timestamp) {
                    line += formatIsoDate(stageData.timestamp);

                    if (index > 0) {
                         const startRef = prevStageData ? prevStageData.timestamp : state.startTime;
                         if (startRef) {
                             const duration = stageData.timestamp - startRef;
                             line += ` (Duration: ${formatDurationHM(duration)})`;
                         }
                    }
                } else {
                    line += "Pending";
                }

                markdown += line + "\n";
            });

            markdown += `\n**Total Time: ${formatDurationHM(totalTime)}**`;
            return markdown;
        }

        function copyToClipboard() {
            const markdown = generateMarkdown();
            const btn = document.getElementById('copy-btn');

            navigator.clipboard.writeText(markdown).then(() => {
                btn.innerText = "Copied!";
                setTimeout(() => {
                    btn.innerText = "Copy to clipboard";
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function toggleStage(id) {
            const stage = state.stages[id];
            
            if (id === 'feed' && !state.startTime) {
                state.startTime = Date.now();
            } else if (!state.startTime) {
                state.startTime = Date.now();
            }

            stage.completed = !stage.completed;
            stage.timestamp = stage.completed ? Date.now() : null;

            saveData();
            render();
        }

        function adjustFolds(id, amount, event) {
            event.stopPropagation();
            state.stages[id].folds = Math.max(0, (state.stages[id].folds || 0) + amount);
            saveData();
            render();
        }

        function render() {
            // Update Loaf Name
            const nameDisplay = document.getElementById('loaf-name-display');
            if (nameDisplay) {
                nameDisplay.innerText = state.loafName || "Sourdough Loaf";
            }

            const container = document.getElementById('stages-container');
            container.innerHTML = '';

            STAGES_CONFIG.forEach((config, index) => {
                const stageData = state.stages[config.id];
                const prevStageConfig = STAGES_CONFIG[index - 1];
                const prevStageData = prevStageConfig ? state.stages[prevStageConfig.id] : null;

                const isActive = !stageData.completed && (index === 0 || prevStageData?.completed);

                let secondaryText = "";
                if (config.isAnchor && stageData.completed) {
                    const d = new Date(stageData.timestamp);
                    secondaryText = `Started: ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                } else if (stageData.completed && stageData.timestamp) {
                    const startRef = index === 0 ? state.startTime : prevStageData?.timestamp;
                    if (startRef) {
                        secondaryText = `Duration: ${formatDuration(stageData.timestamp - startRef)}`;
                    }
                } else if (stageData.timestamp) {
                    secondaryText = "In Progress...";
                }

                const card = document.createElement('div');
                card.onclick = () => toggleStage(config.id);
                card.className = `
                    relative bg-white border-2 rounded-xl p-4 cursor-pointer transition-all duration-200 
                    ${stageData.completed ? 'stage-completed shadow-sm opacity-60' : 'border-stone-200 hover:border-stone-300'}
                    ${isActive ? 'ring-2 ring-amber-400 ring-offset-2 border-amber-200' : ''}
                `;

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-2xl">${config.icon}</div>
                            <div>
                                <h4 class="font-bold ${stageData.completed ? 'text-green-800' : 'text-stone-700'}">${config.name}</h4>
                                <p class="text-[10px] uppercase font-bold text-stone-400">
                                    ${secondaryText || (isActive ? 'Awaiting Completion' : 'Pending')}
                                </p>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-3">
                            ${config.hasCounter && isActive ? `
                                <div class="flex items-center bg-amber-100 rounded-lg p-1 border border-amber-200" onclick="event.stopPropagation()">
                                    <button onclick="adjustFolds('${config.id}', -1, event)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded shadow-sm text-amber-700 font-bold">-</button>
                                    <span class="px-3 font-mono font-bold text-sm text-amber-800">${stageData.folds}</span>
                                    <button onclick="adjustFolds('${config.id}', 1, event)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded shadow-sm text-amber-700 font-bold">+</button>
                                </div>
                            ` : ''}

                            ${config.hasCounter && stageData.completed ? `
                                <div class="text-stone-400 text-xs font-bold mr-2">${stageData.folds} Sets</div>
                            ` : ''}
                            
                            <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${stageData.completed ? 'bg-green-500 border-green-500' : 'border-stone-300'}">
                                ${stageData.completed ? '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                            </div>

                            ${stageData.completed ? `
                                <button onclick="openEditModal('${config.id}', event)" class="p-1 hover:bg-stone-100 rounded text-stone-400 hover:text-stone-600 ml-2" title="Edit Completion Time">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function resetAll() {
            document.getElementById('reset-modal').classList.remove('hidden');
            document.getElementById('reset-modal').classList.add('flex');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.add('hidden');
            document.getElementById('reset-modal').classList.remove('flex');
        }

        function confirmReset() {
            initNewState();
            saveData();
            render();
            closeResetModal();
        }

        function openEditModal(stageId, event) {
            if (event) event.stopPropagation();
            editingStageId = stageId;
            const stage = state.stages[stageId];
            const timestamp = stage.timestamp || Date.now();

            // Format for datetime-local: YYYY-MM-DDThh:mm
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');

            const formatted = `${year}-${month}-${day}T${hours}:${minutes}`;

            document.getElementById('edit-time-input').value = formatted;
            document.getElementById('edit-error').classList.add('hidden');

            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-modal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('flex');
            editingStageId = null;
        }

        function saveEdit() {
            if (!editingStageId) return;

            const inputVal = document.getElementById('edit-time-input').value;
            if (!inputVal) return;

            const newTimestamp = new Date(inputVal).getTime();
            const currentIdx = STAGES_CONFIG.findIndex(s => s.id === editingStageId);
            const nextStageConfig = STAGES_CONFIG[currentIdx + 1];

            // Validation: Cannot be after next stage if next stage is completed
            if (nextStageConfig) {
                const nextStageData = state.stages[nextStageConfig.id];
                if (nextStageData.completed && nextStageData.timestamp && newTimestamp > nextStageData.timestamp) {
                    const errEl = document.getElementById('edit-error');
                    const dateStr = new Date(nextStageData.timestamp).toLocaleString();
                    errEl.innerText = `Completion time cannot be after ${nextStageConfig.name} completion time (${dateStr})`;
                    errEl.classList.remove('hidden');
                    return;
                }
            }

            state.stages[editingStageId].timestamp = newTimestamp;

            // Special case for Feed Starter (Anchor): Update global start time
            if (STAGES_CONFIG[currentIdx].isAnchor) {
                state.startTime = newTimestamp;
            }

            saveData();
            render();
            closeEditModal();
        }

        function toggleNameEdit() {
            const viewEl = document.getElementById('loaf-name-view');
            const inputEl = document.getElementById('loaf-name-input');

            viewEl.classList.add('hidden');
            inputEl.classList.remove('hidden');
            inputEl.value = state.loafName || "Sourdough Loaf";
            inputEl.focus();
        }

        let isEditingCancelled = false;

        function saveName() {
            if (isEditingCancelled) {
                isEditingCancelled = false;
                const viewEl = document.getElementById('loaf-name-view');
                const inputEl = document.getElementById('loaf-name-input');
                const displayEl = document.getElementById('loaf-name-display');

                inputEl.value = state.loafName || "Sourdough Loaf"; // Reset input
                inputEl.classList.add('hidden');
                viewEl.classList.remove('hidden');
                return;
            }

            const viewEl = document.getElementById('loaf-name-view');
            const inputEl = document.getElementById('loaf-name-input');
            const displayEl = document.getElementById('loaf-name-display');

            let newName = inputEl.value.trim();
            if (!newName) {
                newName = "Sourdough Loaf";
            }

            state.loafName = newName;
            saveData();

            displayEl.innerText = newName;

            inputEl.classList.add('hidden');
            viewEl.classList.remove('hidden');
        }

        function handleNameKey(event) {
            if (event.key === 'Enter') {
                event.target.blur();
            } else if (event.key === 'Escape') {
                isEditingCancelled = true;
                event.target.blur();
            }
        }

        setInterval(() => {
            const clockEl = document.getElementById('total-clock');
            const activeNameEl = document.getElementById('active-name');
            const activeDurEl = document.getElementById('active-duration');
            const activeLabelEl = document.getElementById('active-label');

            if (state.startTime) {
                const now = Date.now();
                
                // Final stage is now 'cool'
                const isFinished = state.stages['cool'].completed;
                const endTime = isFinished ? state.stages['cool'].timestamp : now;
                const totalElapsed = endTime - state.startTime;
                
                clockEl.innerText = formatDuration(totalElapsed);

                let activeIdx = STAGES_CONFIG.findIndex(s => !state.stages[s.id].completed);
                
                if (activeIdx === -1) {
                    activeNameEl.innerText = "Process Complete 🥖";
                    activeDurEl.innerText = "--:--:--";
                    activeLabelEl.innerText = "Summary";
                } else {
                    const activeStageConfig = STAGES_CONFIG[activeIdx];
                    const prevStageConfig = STAGES_CONFIG[activeIdx - 1];
                    const stageStartTime = prevStageConfig ? state.stages[prevStageConfig.id].timestamp : state.startTime;
                    
                    activeNameEl.innerText = activeStageConfig.icon + " " + activeStageConfig.name;
                    activeDurEl.innerText = formatDuration(now - (stageStartTime || now));
                    activeLabelEl.innerText = "Active Stage";
                }
            } else {
                clockEl.innerText = "00:00:00";
                activeNameEl.innerText = "Waiting to start...";
                activeDurEl.innerText = "00:00:00";
                activeLabelEl.innerText = "Ready";
            }
        }, 1000);

        window.onload = () => {
            loadData();
            render();
        };
    </script>
</body>
</html>
