<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    CSP: restricts resource loading to the known CDN origins used by this tool.
    Notes:
      - 'unsafe-inline' is required for Tailwind's injected styles and React inline styles.
      - 'unsafe-eval' is required by Babel standalone for JSX transpilation.
      - worker-src blob: is required for the PDF.js web worker.
      - SRI for cdn.tailwindcss.com is not feasible (dynamic CDN; content varies per request).
      - SRI for esm.sh import-map entries is not supported by the importmap spec yet.
      - SRI for the dynamically injected PDF.js <script> is applied via script.integrity in JS.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' 'unsafe-eval'
                https://cdn.tailwindcss.com
                https://unpkg.com
                https://esm.sh
                https://cdnjs.cloudflare.com;
    worker-src  blob:;
    style-src   'self' 'unsafe-inline' https://cdn.tailwindcss.com;
    connect-src 'self' https://esm.sh blob:;
    img-src     'self' blob: data:;
    font-src    'self' data:;
  ">
  <title>Town Hall Presenter</title>

  <!-- Tailwind CSS (SRI not feasible for this dynamic CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Static ticker animation; duration is driven by --ticker-anim-duration CSS variable
       set inline on the ticker container, so this block never needs to change. -->
  <style>
    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-33.33%); }
    }
    .animate-ticker {
      display: inline-flex;
      white-space: nowrap;
      animation: ticker var(--ticker-anim-duration, 20s) linear infinite;
    }
    .animate-ticker:hover { animation-play-state: paused; }
  </style>

  <!-- Import Map to allow modern module imports in the browser -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react"
      }
    }
  </script>

  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- The application code, defined as a Babel-processed module -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Upload, Trash2, Plus, MonitorPlay, X, FileText, ChevronLeft, ChevronRight, Info, FileSpreadsheet } from 'lucide-react';

    // ---------------------------------------------------------------------------
    // Constants – defined outside the component so they are never recreated
    // ---------------------------------------------------------------------------
    const BRAND_COLOR        = '#005EB8';
    const BRAND_DARK         = '#003087';
    const BRAND_LIGHT        = '#41B6E6';
    const TICKER_HEIGHT_PX   = 80;   // height of the ticker tape bar in px
    const SCALE_PADDING      = 0.98; // 2% padding so slides don't touch screen edges
    const SECONDS_PER_ITEM   = 8;    // animation speed: seconds per shout-out card
    const MIN_ANIM_DURATION  = 20;   // minimum total ticker duration in seconds
    const LS_KEY             = 'townhall-shoutouts';
    const DEFAULT_TICKER_ITEM = Object.freeze({
      id: 'default',
      to: 'The Team',
      from: 'Management',
      message: 'Welcome to the Town Hall!',
    });
    const PDFJS_VERSION  = '3.11.174';
    const PDFJS_BASE     = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}`;
    // SRI hashes for the PDF.js CDN files (sha384)
    const PDFJS_MAIN_INTEGRITY   = 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e';
    const PDFJS_WORKER_INTEGRITY = 'sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2';

    // ---------------------------------------------------------------------------
    // Utility – CSV row parser (handles quoted fields & escaped double-quotes)
    // ---------------------------------------------------------------------------
    const parseCsvRow = (row) => {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < row.length; i++) {
        const char = row[i];
        if (char === '"') {
          if (inQuotes && row[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    };

    // ---------------------------------------------------------------------------
    // PresentationView – full-screen PDF viewer with shout-out ticker tape.
    //   Manages its own PDF document lifecycle, page rendering, and navigation.
    // ---------------------------------------------------------------------------
    function PresentationView({ pdfFileUrl, pdfFileName, shoutOuts, pdfjsLoaded, onExit, onError }) {
      const [pdfDoc, setPdfDoc] = useState(null);
      const [pageNum, setPageNum] = useState(1);
      const [numPages, setNumPages] = useState(0);

      const isRenderingRef = useRef(false);
      const pendingPageRef = useRef(null);
      const canvasRef      = useRef(null);
      const pdfDocRef      = useRef(null);

      useEffect(() => { pdfDocRef.current = pdfDoc; }, [pdfDoc]);

      // Lock body scroll while presenting
      useEffect(() => {
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        return () => {
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
        };
      }, []);

      // Destroy PDF document on unmount
      useEffect(() => {
        return () => { if (pdfDocRef.current) pdfDocRef.current.destroy(); };
      }, []);

      // -----------------------------------------------------------------------
      // Page rendering
      // -----------------------------------------------------------------------
      const renderPage = useCallback(async (num, doc = pdfDoc) => {
        if (!doc || !canvasRef.current) return;
        if (isRenderingRef.current) {
          pendingPageRef.current = num;
          return;
        }
        isRenderingRef.current = true;
        try {
          const page = await doc.getPage(num);
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const viewport = page.getViewport({ scale: 1 });
          const containerWidth  = window.innerWidth;
          const containerHeight = window.innerHeight - TICKER_HEIGHT_PX;
          const scale = Math.min(
            (containerWidth  * SCALE_PADDING) / viewport.width,
            (containerHeight * SCALE_PADDING) / viewport.height,
          );
          const scaledViewport = page.getViewport({ scale });
          canvas.height = scaledViewport.height;
          canvas.width  = scaledViewport.width;
          await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
        } catch (err) {
          if (!String(err?.message).includes('cancelled')) {
            console.error('Error rendering page:', err);
          }
        } finally {
          isRenderingRef.current = false;
          if (pendingPageRef.current !== null) {
            const next = pendingPageRef.current;
            pendingPageRef.current = null;
            renderPage(next, doc);
          }
        }
      }, [pdfDoc]);

      // -----------------------------------------------------------------------
      // Effects
      // -----------------------------------------------------------------------

      // Load PDF document on mount
      useEffect(() => {
        if (!pdfFileUrl || !pdfjsLoaded || pdfDoc) return;
        (async () => {
          try {
            const doc = await window.pdfjsLib.getDocument(pdfFileUrl).promise;
            pdfDocRef.current = doc;
            setPdfDoc(doc);
            setNumPages(doc.numPages);
            renderPage(1, doc);
          } catch (err) {
            console.error('Error loading PDF:', err);
            onError('Failed to load the PDF. Please try re-uploading.');
          }
        })();
      }, [pdfFileUrl, pdfjsLoaded, pdfDoc, renderPage, onError]);

      // Re-render when the page number changes
      useEffect(() => {
        if (pdfDoc) renderPage(pageNum);
      }, [pageNum, pdfDoc, renderPage]);

      // Debounced resize handler (150 ms)
      useEffect(() => {
        let timer = null;
        const handleResize = () => {
          clearTimeout(timer);
          timer = setTimeout(() => { if (pdfDoc) renderPage(pageNum); }, 150);
        };
        window.addEventListener('resize', handleResize);
        return () => { window.removeEventListener('resize', handleResize); clearTimeout(timer); };
      }, [pdfDoc, pageNum, renderPage]);

      // Keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
            setPageNum(prev => Math.min(prev + 1, numPages));
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            setPageNum(prev => Math.max(prev - 1, 1));
          } else if (e.key === 'Escape') {
            onExit();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [numPages, onExit]);

      // Touch / swipe navigation
      useEffect(() => {
        let touchStartX = null;
        const onTouchStart = (e) => { touchStartX = e.touches[0].clientX; };
        const onTouchEnd = (e) => {
          if (touchStartX === null) return;
          const delta = touchStartX - e.changedTouches[0].clientX;
          if (Math.abs(delta) > 50) {
            setPageNum(prev =>
              delta > 0 ? Math.min(prev + 1, numPages) : Math.max(prev - 1, 1)
            );
          }
          touchStartX = null;
        };
        window.addEventListener('touchstart', onTouchStart, { passive: true });
        window.addEventListener('touchend',   onTouchEnd,   { passive: true });
        return () => {
          window.removeEventListener('touchstart', onTouchStart);
          window.removeEventListener('touchend',   onTouchEnd);
        };
      }, [numPages]);

      // -----------------------------------------------------------------------
      // Ticker data
      // -----------------------------------------------------------------------
      const tickerItems = useMemo(
        () => shoutOuts.length > 0 ? shoutOuts : [DEFAULT_TICKER_ITEM],
        [shoutOuts],
      );
      const duplicateTicker = useMemo(
        () => [...tickerItems, ...tickerItems, ...tickerItems],
        [tickerItems],
      );
      const tickerAnimDuration = useMemo(
        () => Math.max(tickerItems.length * SECONDS_PER_ITEM, MIN_ANIM_DURATION),
        [tickerItems],
      );

      // -----------------------------------------------------------------------
      // Render
      // -----------------------------------------------------------------------
      return (
        <div
          className="flex flex-col h-screen w-screen bg-black overflow-hidden font-sans"
          style={{ '--ticker-anim-duration': `${tickerAnimDuration}s` }}
        >
          {/* Top Control Bar – visible on hover */}
          <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-center opacity-0 hover:opacity-100 transition-opacity z-50 bg-gradient-to-b from-black/80 to-transparent text-white">
            <div className="flex items-center space-x-2">
              <span className="font-bold">Town Hall</span>
              <span className="text-gray-400 text-sm">| Presenting: {pdfFileName}</span>
            </div>
            <div className="flex items-center space-x-4">
              <span className="text-sm bg-black/50 px-3 py-1 rounded-full" aria-live="polite">
                Page {pageNum} of {numPages}
              </span>
              <button
                onClick={onExit}
                className="flex items-center px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md text-sm font-medium transition-colors"
              >
                <X className="w-4 h-4 mr-2" aria-hidden="true" /> Exit Presentation
              </button>
            </div>
          </div>

          {/* Navigation – Previous slide */}
          <button
            aria-label="Previous slide"
            onClick={() => setPageNum(prev => Math.max(prev - 1, 1))}
            className="absolute left-0 top-0 bottom-20 w-1/6 z-40 flex items-center justify-start pl-4 group bg-transparent border-0 cursor-pointer"
          >
            <div className="opacity-0 group-hover:opacity-100 p-2 bg-black/40 rounded-full text-white transition-opacity">
              <ChevronLeft className="w-10 h-10" aria-hidden="true" />
            </div>
          </button>

          {/* Navigation – Next slide */}
          <button
            aria-label="Next slide"
            onClick={() => setPageNum(prev => Math.min(prev + 1, numPages))}
            className="absolute right-0 top-0 bottom-20 w-1/6 z-40 flex items-center justify-end pr-4 group bg-transparent border-0 cursor-pointer"
          >
            <div className="opacity-0 group-hover:opacity-100 p-2 bg-black/40 rounded-full text-white transition-opacity">
              <ChevronRight className="w-10 h-10" aria-hidden="true" />
            </div>
          </button>

          {/* Main PDF Display */}
          <div className="flex-1 flex items-center justify-center bg-[#1a1a1a] relative z-10 overflow-hidden">
            {!pdfDoc && (
              <div className="text-white animate-pulse">Loading presentation…</div>
            )}
            <canvas
              ref={canvasRef}
              className="shadow-2xl"
              role="img"
              aria-label={`Presentation slide ${pageNum} of ${numPages}`}
            />
          </div>

          {/* Ticker Tape */}
          <div
            role="marquee"
            aria-label="Staff shout-outs"
            className="shrink-0 relative z-50 border-t-4 overflow-hidden flex items-center"
            style={{ height: `${TICKER_HEIGHT_PX}px`, backgroundColor: BRAND_COLOR, borderColor: BRAND_LIGHT }}
          >
            <div className="animate-ticker">
              {duplicateTicker.map((s, i) => (
                <div key={`${s.id}-${i}`} className="inline-flex items-center mx-12 text-2xl text-white">
                  <span className="text-yellow-300 mr-3" aria-hidden="true">⭐</span>
                  <span className="font-bold mr-2">To: {s.to}</span>
                  <span className="text-white/50 mr-2" aria-hidden="true">|</span>
                  <span className="italic mr-3 text-white/80">From: {s.from}</span>
                  <span className="font-light tracking-wide">— "{s.message}"</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ---------------------------------------------------------------------------
    // App – edit mode UI with PDF upload, shout-out CRUD, and CSV import
    // ---------------------------------------------------------------------------
    function App() {
      const [mode, setMode] = useState('edit'); // 'edit' | 'present'

      // Restore shout-outs from localStorage on first render
      const [shoutOuts, setShoutOuts] = useState(() => {
        try {
          const saved = localStorage.getItem(LS_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [pdfFile, setPdfFile] = useState(null);      // blob URL string
      const [pdfFileName, setPdfFileName] = useState('');
      const [errorMessage, setErrorMessage] = useState('');
      const [importToast, setImportToast] = useState('');
      const [isDragOver, setIsDragOver] = useState(false);

      // Form state
      const [newTo, setNewTo] = useState('');
      const [newFrom, setNewFrom] = useState('');
      const [newMessage, setNewMessage] = useState('');

      const [pdfjsLoaded, setPdfjsLoaded] = useState(false);
      const csvInputRef    = useRef(null);
      const pdfFileUrlRef  = useRef(null); // tracks latest blob URL for unmount cleanup

      // Keep ref in sync so the unmount cleanup always revokes the latest URL
      useEffect(() => { pdfFileUrlRef.current = pdfFile; }, [pdfFile]);

      // -----------------------------------------------------------------------
      // Persist shout-outs to localStorage whenever they change
      // -----------------------------------------------------------------------
      useEffect(() => {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(shoutOuts));
        } catch { /* storage quota exceeded – silently ignore */ }
      }, [shoutOuts]);

      // -----------------------------------------------------------------------
      // Load PDF.js dynamically; clean up the injected <script> on unmount
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (window.pdfjsLib) {
          setPdfjsLoaded(true);
          return;
        }
        const script = document.createElement('script');
        script.src = `${PDFJS_BASE}/pdf.min.js`;
        script.integrity = PDFJS_MAIN_INTEGRITY;
        script.crossOrigin = 'anonymous';
        script.onload = () => {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/pdf.worker.min.js`;
          setPdfjsLoaded(true);
        };
        document.body.appendChild(script);
        return () => {
          if (script.parentNode) script.parentNode.removeChild(script);
        };
      }, []);

      // Revoke blob URL on unmount
      useEffect(() => {
        return () => { if (pdfFileUrlRef.current) URL.revokeObjectURL(pdfFileUrlRef.current); };
      }, []);

      // -----------------------------------------------------------------------
      // File upload
      // -----------------------------------------------------------------------
      const processFile = (file) => {
        if (!file || file.type !== 'application/pdf') {
          setErrorMessage('Please upload a valid PDF file.');
          return;
        }
        // Revoke the previous blob URL to free memory
        if (pdfFile) URL.revokeObjectURL(pdfFile);

        const fileUrl = URL.createObjectURL(file);
        setPdfFile(fileUrl);
        setPdfFileName(file.name);
        setErrorMessage('');
      };

      const handleFileUpload = (e) => processFile(e.target.files[0]);

      const handleDragOver  = (e) => { e.preventDefault(); setIsDragOver(true); };
      const handleDragLeave = () => setIsDragOver(false);
      const handleDrop      = (e) => {
        e.preventDefault();
        setIsDragOver(false);
        processFile(e.dataTransfer.files[0]);
      };

      // -----------------------------------------------------------------------
      // Shout-out CRUD
      // -----------------------------------------------------------------------
      const addShoutOut = (e) => {
        e.preventDefault();
        if (!newTo.trim() || !newMessage.trim()) return;
        setShoutOuts(prev => [...prev, {
          id: crypto.randomUUID(),
          to: newTo.trim(),
          from: newFrom.trim() || 'Anonymous',
          message: newMessage.trim(),
        }]);
        setNewTo('');
        setNewFrom('');
        setNewMessage('');
      };

      const deleteShoutOut = (id) => {
        setShoutOuts(prev => prev.filter(s => s.id !== id));
      };

      // -----------------------------------------------------------------------
      // CSV import
      // -----------------------------------------------------------------------
      const handleCsvUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.value = ''; // allow re-importing the same file
        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          // Normalise all line-ending variants (CRLF, CR, LF) in a single pass
          const lines = text.replace(/\r\n|\r|\n/g, '\n').split('\n').filter(l => l.trim() !== '');
          if (lines.length === 0) return;

          const firstRow = parseCsvRow(lines[0]);
          const isHeader = firstRow.length >= 3 &&
            firstRow[0].toLowerCase() === 'to' &&
            firstRow[1].toLowerCase() === 'from' &&
            firstRow[2].toLowerCase() === 'message';
          const dataLines = isHeader ? lines.slice(1) : lines;

          const imported = dataLines
            .map(line => parseCsvRow(line))
            .filter(cols => cols.length >= 3 && cols[0])
            .map(cols => ({
              id: crypto.randomUUID(),
              to: cols[0],
              from: cols[1] || 'Anonymous',
              message: cols[2],
            }));

          if (imported.length === 0) {
            setErrorMessage('No valid rows found. Ensure the CSV has columns: to, from, message');
            return;
          }
          setShoutOuts(prev => [...prev, ...imported]);
          const label = `Imported ${imported.length} shout-out${imported.length !== 1 ? 's' : ''}`;
          setImportToast(label);
          setTimeout(() => setImportToast(''), 4000);
        };
        reader.readAsText(file);
      };

      // -----------------------------------------------------------------------
      // Presentation entry guard
      // -----------------------------------------------------------------------
      const startPresentation = () => {
        if (!pdfFile) {
          setErrorMessage('Please upload your PDF slides first.');
          return;
        }
        if (!pdfjsLoaded) {
          setErrorMessage('PDF library is still loading — please wait a moment.');
          return;
        }
        setMode('present');
      };

      // =====================================================================
      // Render
      // =====================================================================
      if (mode === 'present') {
        return (
          <PresentationView
            pdfFileUrl={pdfFile}
            pdfFileName={pdfFileName}
            shoutOuts={shoutOuts}
            pdfjsLoaded={pdfjsLoaded}
            onExit={() => setMode('edit')}
            onError={(msg) => { setErrorMessage(msg); setMode('edit'); }}
          />
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 font-sans">

          {/* Error Banner */}
          {errorMessage && (
            <div
              role="alert"
              className="fixed top-0 left-0 right-0 z-[100] flex items-center justify-between px-6 py-3 bg-red-600 text-white shadow-lg"
            >
              <span className="text-sm font-medium">{errorMessage}</span>
              <button
                onClick={() => setErrorMessage('')}
                aria-label="Dismiss error"
                className="ml-4 p-1 rounded hover:bg-red-700 transition-colors"
              >
                <X className="w-4 h-4" aria-hidden="true" />
              </button>
            </div>
          )}

          {/* Import Success Toast */}
          {importToast && (
            <div
              role="status"
              aria-live="polite"
              className="fixed top-4 right-4 z-[100] px-4 py-3 bg-green-600 text-white text-sm font-medium rounded-lg shadow-lg"
            >
              ✓ {importToast}
            </div>
          )}

          {/* Header */}
          <header className="text-white shadow-md relative z-10" style={{ backgroundColor: BRAND_COLOR }}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex items-center justify-between">
              <h1 className="text-2xl font-bold tracking-tight">Town Hall Presenter</h1>
              <button
                onClick={startPresentation}
                disabled={!pdfFile}
                className={`flex items-center px-6 py-3 rounded-md font-semibold transition-all shadow-sm
                  ${pdfFile
                    ? 'bg-green-500 hover:bg-green-600 text-white transform hover:scale-105'
                    : 'bg-gray-400 text-gray-200 cursor-not-allowed'}`}
              >
                <MonitorPlay className="w-5 h-5 mr-2" aria-hidden="true" />
                Start Presentation
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">

              {/* Left Column: PDF Upload */}
              <div className="lg:col-span-1 space-y-6">
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                  <h2 className="text-lg font-bold mb-4 flex items-center" style={{ color: BRAND_DARK }}>
                    <FileText className="w-5 h-5 mr-2" style={{ color: BRAND_COLOR }} aria-hidden="true" />
                    1. Upload Presentation Slides
                  </h2>
                  <p className="text-sm text-gray-600 mb-4">
                    Upload the main slide deck (PDF format only) for the Town Hall meeting.
                  </p>
                  <label
                    htmlFor="file-upload"
                    className={`flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer transition-colors ${
                      isDragOver
                        ? 'bg-blue-50 border-blue-400'
                        : 'border-gray-300 bg-gray-50 hover:bg-blue-50 hover:border-blue-300'
                    }`}
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={handleDrop}
                  >
                    <Upload className={`w-8 h-8 mb-2 ${isDragOver ? 'text-blue-400' : 'text-gray-400'}`} aria-hidden="true" />
                    <span className="text-sm text-gray-500 font-medium">Click or drag a PDF here</span>
                    <input
                      id="file-upload"
                      type="file"
                      accept="application/pdf"
                      className="sr-only"
                      onChange={handleFileUpload}
                    />
                  </label>
                  {pdfFileName && (
                    <div className="mt-4 p-3 bg-blue-50 border border-blue-100 rounded-md flex items-center text-sm text-blue-800">
                      <FileText className="w-4 h-4 mr-2 text-blue-600 shrink-0" aria-hidden="true" />
                      <span className="truncate font-medium">{pdfFileName}</span>
                    </div>
                  )}
                </div>

                <div className="bg-blue-50 rounded-xl border border-blue-100 p-6">
                  <h3 className="text-sm font-bold text-blue-900 mb-2 flex items-center">
                    <Info className="w-4 h-4 mr-1" aria-hidden="true" /> Presenter Controls
                  </h3>
                  <ul className="text-sm text-blue-800 space-y-2 list-disc pl-4 marker:text-blue-400">
                    <li>Press <kbd className="px-1.5 py-0.5 bg-white border border-blue-200 rounded text-xs font-mono">Space</kbd> or <kbd className="px-1.5 py-0.5 bg-white border border-blue-200 rounded text-xs font-mono">→</kbd> for Next Page</li>
                    <li>Press <kbd className="px-1.5 py-0.5 bg-white border border-blue-200 rounded text-xs font-mono">←</kbd> for Previous Page</li>
                    <li>Press <kbd className="px-1.5 py-0.5 bg-white border border-blue-200 rounded text-xs font-mono">Esc</kbd> to exit presentation</li>
                    <li>Swipe left or right on touch screens to navigate.</li>
                    <li>Hover at the top of the screen to view slide number and exit button.</li>
                  </ul>
                </div>
              </div>

              {/* Right Column: Shout-outs */}
              <div className="lg:col-span-2">
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-full flex flex-col">
                  <h2 className="text-lg font-bold mb-6 flex items-center" style={{ color: BRAND_DARK }}>
                    <span className="text-2xl mr-2" aria-hidden="true">⭐</span>
                    2. Manage Shout-outs
                  </h2>

                  {/* Add Form */}
                  <form onSubmit={addShoutOut} className="bg-gray-50 p-5 rounded-lg border border-gray-200 mb-8">
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="text-sm font-bold text-gray-700 uppercase tracking-wide">Add New Shout-out</h3>
                      <div>
                        {/* Hidden file input; triggered by the visible button below */}
                        <input
                          type="file"
                          accept=".csv,text/csv"
                          ref={csvInputRef}
                          className="sr-only"
                          aria-hidden="true"
                          tabIndex="-1"
                          onChange={handleCsvUpload}
                        />
                        {/* Visually-hidden description linked via aria-describedby */}
                        <p id="csv-format-hint" className="sr-only">
                          Expected CSV format: three columns named "to", "from", and "message".
                          A header row is optional and will be skipped automatically.
                          Compatible with Excel exports.
                        </p>
                        <div className="relative group/tooltip">
                          <button
                            type="button"
                            onClick={() => csvInputRef.current && csvInputRef.current.click()}
                            aria-describedby="csv-format-hint"
                            className="flex items-center px-3 py-1.5 text-sm font-medium text-green-700 bg-green-50 border border-green-200 rounded-md hover:bg-green-100 transition-colors"
                          >
                            <FileSpreadsheet className="w-4 h-4 mr-1.5" aria-hidden="true" />
                            Import CSV
                          </button>
                          <div className="absolute right-0 top-full mt-2 w-72 bg-gray-900 text-white text-xs rounded-lg p-3 shadow-xl z-50 pointer-events-none opacity-0 group-hover/tooltip:opacity-100 transition-opacity duration-150" aria-hidden="true">
                            <p className="font-bold mb-1.5 text-green-300">Expected CSV format</p>
                            <p className="mb-2 text-gray-300">Three columns, compatible with Excel exports. A header row is optional and will be skipped automatically.</p>
                            <code className="block bg-gray-800 rounded p-2 leading-relaxed text-green-200 whitespace-pre">{'to,from,message\nTeam Name,Sender,Well done!'}</code>
                            <div className="absolute -top-1.5 right-4 w-3 h-3 bg-gray-900 rotate-45" aria-hidden="true" />
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                      <div>
                        <label htmlFor="shoutout-to" className="block text-sm font-medium text-gray-700 mb-1">
                          To (Recipient / Team)
                        </label>
                        <input
                          id="shoutout-to"
                          type="text"
                          value={newTo}
                          onChange={e => setNewTo(e.target.value)}
                          placeholder="e.g. Front-end Dev Team"
                          className="w-full rounded-md border-gray-300 border p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                          required
                        />
                      </div>
                      <div>
                        <label htmlFor="shoutout-from" className="block text-sm font-medium text-gray-700 mb-1">
                          From (Sender)
                        </label>
                        <input
                          id="shoutout-from"
                          type="text"
                          value={newFrom}
                          onChange={e => setNewFrom(e.target.value)}
                          placeholder="e.g. John Smith"
                          className="w-full rounded-md border-gray-300 border p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                        />
                      </div>
                    </div>

                    <div className="mb-4">
                      <label htmlFor="shoutout-message" className="block text-sm font-medium text-gray-700 mb-1">
                        Message
                      </label>
                      <textarea
                        id="shoutout-message"
                        value={newMessage}
                        onChange={e => setNewMessage(e.target.value)}
                        placeholder="Briefly describe why you are shouting them out…"
                        rows="2"
                        className="w-full rounded-md border-gray-300 border p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"
                        required
                      />
                    </div>

                    <button
                      type="submit"
                      className="flex items-center text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors font-medium text-sm shadow-sm"
                      style={{ backgroundColor: BRAND_COLOR }}
                    >
                      <Plus className="w-4 h-4 mr-1" aria-hidden="true" /> Add to Ticker Tape
                    </button>
                  </form>

                  {/* Shout-outs List */}
                  <div className="flex-1 flex flex-col">
                    <div className="flex justify-between items-center mb-3">
                      <h3 className="text-sm font-bold text-gray-700 uppercase tracking-wide">
                        Current Queue ({shoutOuts.length})
                      </h3>
                    </div>
                    <div className="flex-1 overflow-y-auto pr-2" style={{ maxHeight: '400px' }}>
                      {shoutOuts.length === 0 ? (
                        <div className="text-center py-10 text-gray-500 border-2 border-dashed border-gray-200 rounded-lg">
                          No shout-outs yet. Add one above or import a CSV file.
                        </div>
                      ) : (
                        <ul className="space-y-3" aria-label="Shout-out queue">
                          {shoutOuts.map((shout, index) => (
                            <li key={shout.id} className="bg-white border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow transition-shadow flex items-start relative">
                              <div className="bg-yellow-100 text-yellow-600 rounded-full w-8 h-8 flex items-center justify-center font-bold mr-4 shrink-0 mt-1" aria-hidden="true">
                                {index + 1}
                              </div>
                              <div className="flex-1 pr-10">
                                <p className="text-sm mb-1">
                                  <span className="font-bold text-gray-900">{shout.to}</span>
                                  <span className="text-gray-400 mx-2" aria-hidden="true">|</span>
                                  <span className="text-gray-600 italic">From: {shout.from}</span>
                                </p>
                                <p className="text-gray-800 text-sm">{shout.message}</p>
                              </div>
                              <button
                                onClick={() => deleteShoutOut(shout.id)}
                                aria-label={`Remove shout-out to ${shout.to}`}
                                className="absolute right-4 top-4 text-gray-400 hover:text-red-500 p-1 rounded-md hover:bg-red-50 transition-colors"
                              >
                                <Trash2 className="w-5 h-5" aria-hidden="true" />
                              </button>
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
