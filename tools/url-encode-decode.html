<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart URL Encoder/Decoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #0f172a);
            color: #f1f5f9;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        textarea::placeholder {
            color: #475569;
        }

        /* Custom Scrollbar */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col p-4 md:p-6 lg:p-8">

    <div class="w-full max-w-6xl mx-auto flex flex-col h-full space-y-4 md:space-y-6">
        <!-- Header: More compact -->
        <div class="flex items-center justify-between shrink-0">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400">
                    LinkShifter
                </h1>
                <p class="text-slate-500 text-xs mt-1">Real-time Auto-Detection</p>
            </div>
            
            <!-- Legend -->
            <div class="hidden sm:flex items-center gap-4 text-[10px] uppercase tracking-widest font-bold text-slate-500">
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                    Encoding
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    Decoding
                </div>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6 flex-grow min-h-0">
            
            <!-- Input Panel -->
            <div class="glass-card rounded-2xl p-4 md:p-5 shadow-2xl flex flex-col min-h-0">
                <div class="flex items-center justify-between mb-3 shrink-0">
                    <h2 class="text-[11px] font-bold uppercase tracking-widest text-slate-500">Source Input</h2>
                    <button onclick="clearInput()" class="text-[10px] text-slate-400 hover:text-red-400 transition-colors flex items-center gap-1 font-bold uppercase">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        Clear
                    </button>
                </div>
                <div class="relative flex-grow min-h-0">
                    <textarea 
                        id="urlInput"
                        placeholder="Paste your URL or text here..."
                        class="w-full h-full bg-slate-900/50 text-blue-100 p-4 rounded-xl border border-slate-700/50 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all outline-none mono-font text-sm leading-relaxed resize-none"
                        spellcheck="false"
                    ></textarea>
                </div>
                <div class="flex justify-between items-center mt-3 text-[10px] text-slate-500 font-mono shrink-0">
                    <div id="inputCharCount">0 chars</div>
                    <div class="flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                        </svg>
                        Input Area
                    </div>
                </div>
            </div>

            <!-- Output Panel -->
            <div class="glass-card rounded-2xl p-4 md:p-5 shadow-2xl flex flex-col min-h-0">
                <div class="flex items-center justify-between mb-3 shrink-0">
                    <div class="flex items-center gap-3">
                        <h2 class="text-[11px] font-bold uppercase tracking-widest text-slate-500">Transformed Result</h2>
                        <div id="statusBadge" class="px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider bg-slate-800 text-slate-500 border border-slate-700 transition-all duration-300">
                            Idle
                        </div>
                    </div>
                    <div id="copyFeedback" class="text-green-400 text-[9px] font-bold opacity-0 transition-opacity duration-300 uppercase">
                        Copied!
                    </div>
                </div>
                <div class="relative flex-grow min-h-0">
                    <textarea 
                        id="urlOutput"
                        readonly
                        placeholder="Result will appear here..."
                        class="w-full h-full bg-slate-900/30 text-indigo-200 p-4 rounded-xl border border-slate-800 cursor-default outline-none mono-font text-sm leading-relaxed resize-none"
                        spellcheck="false"
                    ></textarea>
                    
                    <button 
                        onclick="copyToClipboard()"
                        class="absolute bottom-3 right-3 bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg transition-all shadow-lg active:scale-95 flex items-center justify-center border border-white/10"
                        title="Copy to clipboard"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                    </button>
                </div>
                <div class="flex justify-between items-center mt-3 text-[10px] text-slate-500 font-mono shrink-0">
                    <div id="outputCharCount">0 chars</div>
                    <div class="flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293 9.293a1 1 0 011.414 0L9 14.586V7a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                        Output Area
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const input = document.getElementById('urlInput');
        const output = document.getElementById('urlOutput');
        const status = document.getElementById('statusBadge');
        const inputCount = document.getElementById('inputCharCount');
        const outputCount = document.getElementById('outputCharCount');
        const feedback = document.getElementById('copyFeedback');

        input.addEventListener('input', () => {
            const val = input.value;
            inputCount.innerText = `${val.length} chars`;

            if (!val.trim()) {
                output.value = '';
                outputCount.innerText = '0 chars';
                updateStatus('Idle', 'bg-slate-800', 'text-slate-500');
                return;
            }

            processContent(val);
        });

        function processContent(val) {
            try {
                const hasEncodedPattern = /%[0-9A-Fa-f]{2}/.test(val);

                if (hasEncodedPattern) {
                    const decoded = decodeURIComponent(val);
                    output.value = decoded;
                    updateStatus('Decoded', 'bg-emerald-900/30', 'text-emerald-400');
                } else {
                    const encoded = encodeURIComponent(val)
                        .replace(/[!'()*]/g, c => `%${c.charCodeAt(0).toString(16).toUpperCase()}`);
                    
                    output.value = encoded;
                    updateStatus('Encoded', 'bg-blue-900/30', 'text-blue-400');
                }
                outputCount.innerText = `${output.value.length} chars`;
            } catch (err) {
                output.value = 'Error: Malformed input. Unable to process.';
                updateStatus('Error', 'bg-red-900/30', 'text-red-400');
            }
        }

        function updateStatus(text, bgClass, textClass) {
            status.innerText = text;
            status.className = `px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider transition-all duration-300 border border-current/20 ${bgClass} ${textClass}`;
        }

        function clearInput() {
            input.value = '';
            output.value = '';
            inputCount.innerText = '0 chars';
            outputCount.innerText = '0 chars';
            updateStatus('Idle', 'bg-slate-800', 'text-slate-500');
            input.focus();
        }

        function copyToClipboard() {
            if (!output.value) return;
            
            output.select();
            document.execCommand('copy');
            
            feedback.style.opacity = '1';
            setTimeout(() => {
                feedback.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
