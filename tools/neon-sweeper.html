<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SWEEP // Tactical De-mining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #f0ff00;
            --bg-dark: #0a0b10;
            --panel-bg: #161b22;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 5;
            background: linear-gradient(0deg, rgba(0, 243, 255, 0) 0%, rgba(0, 243, 255, 0.05) 50%, rgba(0, 243, 255, 0) 100%);
            opacity: 0.1;
            position: fixed;
            bottom: 100%;
            animation: scanline 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        .grid-cell {
            width: 32px;
            height: 32px;
            min-width: 32px;
            min-height: 32px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            font-size: 1rem;
            user-select: none;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .grid-cell {
                width: 36px;
                height: 36px;
                min-width: 36px;
                min-height: 36px;
            }
        }

        .grid-cell:hover:not(.revealed) {
            background: rgba(0, 243, 255, 0.15);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .grid-cell.revealed {
            background: var(--bg-dark);
            border: 1px solid rgba(0, 243, 255, 0.1);
            box-shadow: none;
            cursor: default;
        }

        .grid-cell.mine {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff0000;
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from { box-shadow: 0 0 5px rgba(255,0,0,0.5); }
            to { box-shadow: 0 0 15px rgba(255,0,0,0.8); }
        }

        .grid-cell.flagged::after {
            content: '▲';
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .grid-cell.unsure::after {
            content: '?';
            color: var(--neon-magenta);
            text-shadow: 0 0 8px var(--neon-magenta);
        }

        .status-display {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .lcd-text {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
        }

        .num-1 { color: #00f3ff; }
        .num-2 { color: #00ff41; }
        .num-3 { color: #ff00ff; }
        .num-4 { color: #f0ff00; }
        .num-5 { color: #ff8c00; }
        .num-6 { color: #ff0000; }
        .num-7 { color: #9d00ff; }
        .num-8 { color: #ffffff; }

        .glitch-text {
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .modal-overlay {
            background: rgba(10, 11, 16, 0.95);
            backdrop-filter: blur(8px);
        }

        .btn-sci-fi {
            position: relative;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 20px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-sci-fi:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        #side-menu {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(22, 27, 34, 0.98);
            border-left: 2px solid var(--neon-cyan);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .menu-item {
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
            transition: all 0.3s;
        }

        .menu-item:hover {
            background: rgba(0, 243, 255, 0.05);
            padding-left: 8px;
        }

        .menu-item.active {
            border-left: 4px solid var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
        }

        .menu-open { overflow: hidden; }

        .custom-scroll::-webkit-scrollbar { height: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0, 243, 255, 0.05); }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }

        .tap-mode-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(22, 27, 34, 0.95);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 243, 255, 0.1);
            z-index: 80;
        }

        .floating-mode-btn {
            padding: 10px 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            transition: all 0.3s;
            border: 1px solid transparent;
            color: rgba(0, 243, 255, 0.6);
        }

        .floating-mode-btn.active {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Chording Effects */
        @keyframes burst-effect {
            0% { outline: 0px solid var(--neon-cyan); outline-offset: 0; opacity: 1; }
            100% { outline: 10px solid transparent; outline-offset: 20px; opacity: 0; }
        }
        .bursting {
            animation: burst-effect 0.4s ease-out;
        }

        @keyframes error-pulse-anim {
            0% { border-color: var(--neon-magenta); box-shadow: 0 0 15px var(--neon-magenta); }
            100% { border-color: rgba(0, 243, 255, 0.2); box-shadow: none; }
        }
        .error-pulse {
            animation: error-pulse-anim 0.5s ease-out;
            z-index: 10;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-4 pb-24">
    <div class="scanline"></div>

    <div class="w-full max-w-md relative z-30 mb-4 mt-2">
        <div class="status-display p-4 md:p-6 flex justify-between items-center border-2 border-cyan-400">
            <div class="flex flex-col">
                <span class="text-[9px] uppercase opacity-50 tracking-tighter">Threats</span>
                <span id="mine-count" class="lcd-text text-xl md:text-2xl font-bold">010</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="reset-btn" class="cursor-pointer hover:scale-110 active:scale-95 transition-transform p-1">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                    </svg>
                </div>

                <div id="menu-trigger" class="cursor-pointer hover:text-white transition-colors p-1">
                    <svg id="burger-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </div>
            </div>

            <div class="flex flex-col items-end">
                <span class="text-[9px] uppercase opacity-50 tracking-tighter">Mission Time</span>
                <span id="timer" class="lcd-text text-xl md:text-2xl font-bold">00:00</span>
            </div>
        </div>
    </div>

    <div id="side-menu" class="fixed top-0 right-0 h-full w-64 z-[100] transform translate-x-full p-8 flex flex-col">
        <div class="flex justify-between items-center mb-12">
            <h3 class="text-lg font-bold tracking-widest text-white">SYSTEM_OS</h3>
            <button id="menu-close" class="text-cyan-400 hover:text-white">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="space-y-8">
            <section>
                <h4 class="text-[10px] uppercase opacity-40 mb-4 tracking-[0.2em]">Sector Density</h4>
                <div class="space-y-2">
                    <button onclick="setDifficulty('easy')" id="diff-easy" class="menu-item w-full text-left py-3 px-2 active">ALPHA [9x9]</button>
                    <button onclick="setDifficulty('medium')" id="diff-medium" class="menu-item w-full text-left py-3 px-2">GAMMA [16x16]</button>
                    <button onclick="setDifficulty('hard')" id="diff-hard" class="menu-item w-full text-left py-3 px-2">OMEGA [30x16]</button>
                </div>
            </section>
        </div>

        <div class="mt-auto opacity-30 text-[10px] tracking-widest text-center">
            V 2.8.5 // NEON_CORE
        </div>
    </div>
    
    <div id="menu-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[90] hidden transition-opacity duration-300 opacity-0"></div>

    <div class="tap-mode-container">
        <button onclick="setTapMode('mine')" id="float-scan-btn" class="floating-mode-btn active">SCAN</button>
        <button onclick="setTapMode('flag')" id="float-mark-btn" class="floating-mode-btn">MARK</button>
    </div>

    <div id="game-scroll-container" class="w-full overflow-x-auto custom-scroll flex justify-center py-4 px-2">
        <div id="grid-border" class="inline-block p-1 border-2 border-cyan-500/30 bg-cyan-900/10 shadow-[0_0_30px_rgba(0,243,255,0.05)] h-fit">
            <div id="grid" class="grid gap-1"></div>
        </div>
    </div>

    <div id="status-modal" class="modal-overlay fixed inset-0 flex items-center justify-center hidden z-[110]">
        <div class="text-center p-8 border-t border-b border-cyan-500 w-full max-w-sm">
            <h2 id="modal-title" class="text-3xl md:text-4xl font-bold mb-4 glitch-text italic">MISSION FAILED</h2>
            <p id="modal-desc" class="mb-8 opacity-70 text-sm">Hull integrity compromised. Reactor core lost.</p>
            <button onclick="initGame()" class="btn-sci-fi">Re-Engage</button>
        </div>
    </div>

    <script>
        const gridElement = document.getElementById('grid');
        const gridBorder = document.getElementById('grid-border');
        const mineCountElement = document.getElementById('mine-count');
        const timerElement = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const modal = document.getElementById('status-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        
        const menuTrigger = document.getElementById('menu-trigger');
        const menuClose = document.getElementById('menu-close');
        const sideMenu = document.getElementById('side-menu');
        const menuBackdrop = document.getElementById('menu-backdrop');

        let rows = 9;
        let cols = 9;
        let minesCount = 10;
        let board = [];
        let timer = null;
        let seconds = 0;
        let gameActive = false;
        let firstMove = true;
        let flagsUsed = 0;
        let tapMode = 'mine';

        const configs = {
            easy: { r: 9, c: 9, m: 10 },
            medium: { r: 16, c: 16, m: 40 },
            hard: { r: 16, c: 30, m: 99 }
        };

        function toggleMenu(show) {
            sideMenu.style.transform = show ? 'translateX(0)' : 'translateX(100%)';
            if (show) {
                menuBackdrop.classList.remove('hidden');
                setTimeout(() => menuBackdrop.classList.add('opacity-100'), 10);
                document.body.classList.add('menu-open');
            } else {
                menuBackdrop.classList.remove('opacity-100');
                setTimeout(() => {
                    menuBackdrop.classList.add('hidden');
                    document.body.classList.remove('menu-open');
                }, 300);
            }
        }

        menuTrigger.onclick = () => toggleMenu(true);
        menuClose.onclick = () => toggleMenu(false);
        menuBackdrop.onclick = () => toggleMenu(false);

        function setDifficulty(level) {
            rows = configs[level].r;
            cols = configs[level].c;
            minesCount = configs[level].m;
            ['easy', 'medium', 'hard'].forEach(l => {
                const el = document.getElementById(`diff-${l}`);
                if (el) el.classList.toggle('active', l === level);
            });
            toggleMenu(false);
            initGame();
        }

        function setTapMode(mode) {
            tapMode = mode;
            document.getElementById('float-scan-btn').classList.toggle('active', mode === 'mine');
            document.getElementById('float-mark-btn').classList.toggle('active', mode === 'flag');
        }

        function initGame() {
            clearInterval(timer);
            timer = null;
            seconds = 0;
            flagsUsed = 0;
            gameActive = true;
            firstMove = true;
            timerElement.textContent = "00:00";
            updateMineCountDisplay();
            modal.classList.add('hidden');
            gridElement.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            createEmptyBoard();
            renderBoard();
        }

        function createEmptyBoard() {
            board = Array.from({ length: rows }, (_, r) => 
                Array.from({ length: cols }, (_, c) => ({
                    r, c,
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    isUnsure: false,
                    neighborCount: 0
                }))
            );
        }

        function generateMines(safeR, safeC) {
            let minesPlaced = 0;
            while (minesPlaced < minesCount) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                if (!board[r][c].isMine && (r !== safeR || c !== safeC)) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].isMine) continue;
                    board[r][c].neighborCount = getNeighbors(r, c).filter(n => n.isMine).length;
                }
            }
        }

        function getNeighbors(r, c) {
            const neighbors = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        neighbors.push(board[nr][nc]);
                    }
                }
            }
            return neighbors;
        }

        function renderBoard() {
            gridElement.innerHTML = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const div = document.createElement('div');
                    div.className = 'grid-cell';
                    div.id = `cell-${r}-${c}`;
                    div.addEventListener('click', (e) => handleCellClick(r, c, false));
                    div.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellClick(r, c, true);
                    });
                    gridElement.appendChild(div);
                }
            }
        }

        function startTimer() {
            if (timer) return;
            timer = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerElement.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function handleCellClick(r, c, isRightClick) {
            if (!gameActive) return;
            startTimer();
            const cell = board[r][c];

            if (cell.isRevealed) {
                handleChording(cell);
                return;
            }

            if (isRightClick || tapMode === 'flag') {
                cycleMark(cell);
                return;
            }

            if (cell.isFlagged || cell.isUnsure) return;

            if (firstMove) {
                firstMove = false;
                generateMines(r, c);
            }

            if (cell.isMine) {
                gameOver(false);
                return;
            }

            revealCell(r, c);
            checkWin();
        }

        function handleChording(cell) {
            if (cell.neighborCount === 0) return;

            const neighbors = getNeighbors(cell.r, cell.c);
            const flagCount = neighbors.filter(n => n.isFlagged).length;

            if (flagCount === cell.neighborCount) {
                // Success: Execute Tactical Burst
                const div = document.getElementById(`cell-${cell.r}-${cell.c}`);
                div.classList.add('bursting');
                setTimeout(() => div.classList.remove('bursting'), 400);

                neighbors.forEach(n => {
                    if (!n.isRevealed && !n.isFlagged && !n.isUnsure) {
                        if (n.isMine) {
                            gameOver(false);
                        } else {
                            revealCell(n.r, n.c);
                        }
                    }
                });
                checkWin();
            } else {
                // Failure: Provide 3x3 Grid Error Feedback
                const highlightGroup = [...neighbors, cell];
                highlightGroup.forEach(n => {
                    const div = document.getElementById(`cell-${n.r}-${n.c}`);
                    if (div) {
                        div.classList.add('error-pulse');
                        setTimeout(() => div.classList.remove('error-pulse'), 500);
                    }
                });
            }
        }

        function cycleMark(cell) {
            if (cell.isRevealed) return;
            
            const cellDiv = document.getElementById(`cell-${cell.r}-${cell.c}`);
            
            if (!cell.isFlagged && !cell.isUnsure) {
                cell.isFlagged = true;
                flagsUsed++;
                cellDiv.classList.add('flagged');
            } else if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.isUnsure = true;
                flagsUsed--;
                cellDiv.classList.remove('flagged');
                cellDiv.classList.add('unsure');
            } else {
                cell.isUnsure = false;
                cellDiv.classList.remove('unsure');
            }
            
            updateMineCountDisplay();
        }

        function updateMineCountDisplay() {
            const display = Math.max(0, minesCount - flagsUsed);
            mineCountElement.textContent = display.toString().padStart(3, '0');
        }

        function revealCell(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged || cell.isUnsure) return;
            cell.isRevealed = true;
            const div = document.getElementById(`cell-${r}-${c}`);
            div.classList.add('revealed');
            if (cell.isMine) {
                div.classList.add('mine');
                div.innerHTML = '☢';
            } else if (cell.neighborCount > 0) {
                div.textContent = cell.neighborCount;
                div.classList.add(`num-${cell.neighborCount}`);
            } else {
                getNeighbors(r, c).forEach(n => revealCell(n.r, n.c));
            }
        }

        function checkWin() {
            let revealedCount = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].isRevealed) revealedCount++;
                }
            }
            if (revealedCount === (rows * cols) - minesCount) {
                gameOver(true);
            }
        }

        function gameOver(isWin) {
            gameActive = false;
            clearInterval(timer);
            if (!isWin) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (board[r][c].isMine) {
                            const div = document.getElementById(`cell-${r}-${c}`);
                            div.classList.add('revealed', 'mine');
                            div.innerHTML = '☢';
                        }
                    }
                }
                modalTitle.textContent = "SYSTEM FAILURE";
                modalTitle.className = "text-3xl md:text-4xl font-bold mb-4 glitch-text italic text-red-500";
                modalDesc.textContent = "Critical detonation detected. Neural link severed.";
            } else {
                modalTitle.textContent = "THREAT CLEARED";
                modalTitle.className = "text-3xl md:text-4xl font-bold mb-4 glitch-text italic text-cyan-400";
                modalDesc.textContent = `Sector secured in ${seconds} seconds. Superior tactical efficiency.`;
            }
            setTimeout(() => modal.classList.remove('hidden'), 500);
        }

        resetBtn.addEventListener('click', initGame);
        window.onload = initGame;
    </script>
</body>
</html>
