<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SWEEP // Tactical De-mining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #f0ff00;
            --bg-dark: #0a0b10;
            --panel-bg: #161b22;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 243, 255, 0) 0%, rgba(0, 243, 255, 0.05) 50%, rgba(0, 243, 255, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        .grid-cell {
            aspect-ratio: 1 / 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            font-size: 1.2rem;
            user-select: none;
        }

        .grid-cell:hover {
            background: rgba(0, 243, 255, 0.15);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .grid-cell.revealed {
            background: var(--bg-dark);
            border: 1px solid rgba(0, 243, 255, 0.1);
            box-shadow: none;
            cursor: default;
        }

        .grid-cell.mine {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff0000;
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from { box-shadow: 0 0 5px rgba(255,0,0,0.5); }
            to { box-shadow: 0 0 15px rgba(255,0,0,0.8); }
        }

        .grid-cell.flagged::after {
            content: '▲';
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .status-display {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            clip-path: polygon(0% 0%, 95% 0%, 100% 25%, 100% 100%, 5% 100%, 0% 75%);
        }

        .lcd-text {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
        }

        .num-1 { color: #00f3ff; }
        .num-2 { color: #00ff41; }
        .num-3 { color: #ff00ff; }
        .num-4 { color: #f0ff00; }
        .num-5 { color: #ff8c00; }
        .num-6 { color: #ff0000; }
        .num-7 { color: #9d00ff; }
        .num-8 { color: #ffffff; }

        .glitch-text {
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .modal-overlay {
            background: rgba(10, 11, 16, 0.95);
            backdrop-filter: blur(8px);
        }

        .btn-sci-fi {
            position: relative;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 20px;
            transition: all 0.3s;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-sci-fi:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .tap-mode-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(22, 27, 34, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--neon-cyan);
            z-index: 50;
        }

        .mode-btn {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: var(--neon-cyan);
            color: var(--bg-dark);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 overflow-auto">
    <div class="scanline"></div>

    <!-- HUD / Header -->
    <div class="w-full max-w-md mb-6 relative z-20">
        <div class="status-display p-6 flex justify-between items-center mb-4">
            <div class="flex flex-col">
                <span class="text-[10px] uppercase opacity-50">Threats Remaining</span>
                <span id="mine-count" class="lcd-text text-2xl font-bold">010</span>
            </div>
            <div id="reset-btn" class="cursor-pointer hover:scale-110 active:scale-95 transition-transform p-2">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                    <path d="M21 3v5h-5"></path>
                </svg>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[10px] uppercase opacity-50">Mission Time</span>
                <span id="timer" class="lcd-text text-2xl font-bold">00:00</span>
            </div>
        </div>
    </div>

    <!-- The Grid Container -->
    <div id="game-container" class="relative group z-10">
        <div id="grid" class="grid gap-1 bg-cyan-900/20 p-1 border border-cyan-500/30 shadow-[0_0_20px_rgba(0,243,255,0.1)]">
            <!-- Grid cells generated by JS -->
        </div>
    </div>

    <!-- Game Status Overlay -->
    <div id="status-modal" class="modal-overlay fixed inset-0 flex items-center justify-center hidden z-[100]">
        <div class="text-center p-8 border-t border-b border-cyan-500 w-full max-w-sm">
            <h2 id="modal-title" class="text-4xl font-bold mb-4 glitch-text italic">MISSION FAILED</h2>
            <p id="modal-desc" class="mb-8 opacity-70">Hull integrity compromised. Reactor core lost.</p>
            <button onclick="initGame()" class="btn-sci-fi">Re-Engage</button>
        </div>
    </div>

    <!-- Difficulty Selectors -->
    <div class="mt-8 mb-12 flex gap-6 text-xs opacity-60 uppercase tracking-widest relative z-20">
        <button onclick="setDifficulty('easy')" class="hover:text-cyan-400 transition-colors border-b border-transparent hover:border-cyan-400">Standard</button>
        <button onclick="setDifficulty('medium')" class="hover:text-cyan-400 transition-colors border-b border-transparent hover:border-cyan-400">Hard</button>
        <button onclick="setDifficulty('hard')" class="hover:text-cyan-400 transition-colors border-b border-transparent hover:border-cyan-400">Expert</button>
    </div>

    <!-- Mobile Mode Toggle -->
    <div class="tap-mode-indicator md:hidden">
        <button id="mode-mine" class="mode-btn active" onclick="setTapMode('mine')">SCAN</button>
        <button id="mode-flag" class="mode-btn" onclick="setTapMode('flag')">MARK</button>
    </div>

    <script>
        const gridElement = document.getElementById('grid');
        const mineCountElement = document.getElementById('mine-count');
        const timerElement = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const modal = document.getElementById('status-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');

        let rows = 9;
        let cols = 9;
        let minesCount = 10;
        let board = [];
        let timer = null;
        let seconds = 0;
        let gameActive = false;
        let flagsUsed = 0;
        let tapMode = 'mine';

        const configs = {
            easy: { r: 9, c: 9, m: 10 },
            medium: { r: 16, c: 16, m: 40 },
            hard: { r: 16, c: 30, m: 99 }
        };

        function setDifficulty(level) {
            rows = configs[level].r;
            cols = configs[level].c;
            minesCount = configs[level].m;
            initGame();
        }

        function setTapMode(mode) {
            tapMode = mode;
            document.getElementById('mode-mine').classList.toggle('active', mode === 'mine');
            document.getElementById('mode-flag').classList.toggle('active', mode === 'flag');
        }

        function initGame() {
            clearInterval(timer);
            timer = null;
            seconds = 0;
            flagsUsed = 0;
            gameActive = true;
            timerElement.textContent = "00:00";
            updateMineCountDisplay();
            modal.classList.add('hidden');
            
            gridElement.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            const cellSize = Math.min(Math.floor((window.innerWidth - 60) / cols), 45);
            gridElement.style.width = `${cellSize * cols + (cols * 4)}px`;

            createBoard();
            renderBoard();
        }

        function createBoard() {
            board = Array.from({ length: rows }, (_, r) => 
                Array.from({ length: cols }, (_, c) => ({
                    r, c,
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    neighborCount: 0
                }))
            );

            let minesPlaced = 0;
            while (minesPlaced < minesCount) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].isMine) continue;
                    board[r][c].neighborCount = getNeighbors(r, c).filter(n => n.isMine).length;
                }
            }
        }

        function getNeighbors(r, c) {
            const neighbors = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        neighbors.push(board[nr][nc]);
                    }
                }
            }
            return neighbors;
        }

        function renderBoard() {
            gridElement.innerHTML = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const div = document.createElement('div');
                    div.className = 'grid-cell';
                    div.id = `cell-${r}-${c}`;
                    div.addEventListener('click', (e) => handleCellClick(r, c, false));
                    div.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellClick(r, c, true);
                    });
                    gridElement.appendChild(div);
                }
            }
        }

        function startTimer() {
            if (timer) return;
            timer = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerElement.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function handleCellClick(r, c, isRightClick) {
            if (!gameActive) return;
            startTimer();

            const cell = board[r][c];

            if (isRightClick || (window.innerWidth < 768 && tapMode === 'flag')) {
                toggleFlag(cell);
                return;
            }

            if (cell.isFlagged || cell.isRevealed) return;

            if (cell.isMine) {
                gameOver(false);
                return;
            }

            revealCell(r, c);
            checkWin();
        }

        function toggleFlag(cell) {
            if (cell.isRevealed) return;
            cell.isFlagged = !cell.isFlagged;
            flagsUsed += cell.isFlagged ? 1 : -1;
            const cellDiv = document.getElementById(`cell-${cell.r}-${cell.c}`);
            cellDiv.classList.toggle('flagged', cell.isFlagged);
            updateMineCountDisplay();
        }

        function updateMineCountDisplay() {
            const display = Math.max(0, minesCount - flagsUsed);
            mineCountElement.textContent = display.toString().padStart(3, '0');
        }

        function revealCell(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            const div = document.getElementById(`cell-${r}-${c}`);
            div.classList.add('revealed');

            if (cell.isMine) {
                div.classList.add('mine');
                div.innerHTML = '☢';
            } else if (cell.neighborCount > 0) {
                div.textContent = cell.neighborCount;
                div.classList.add(`num-${cell.neighborCount}`);
            } else {
                getNeighbors(r, c).forEach(n => revealCell(n.r, n.c));
            }
        }

        function checkWin() {
            let revealedCount = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].isRevealed) revealedCount++;
                }
            }
            if (revealedCount === (rows * cols) - minesCount) {
                gameOver(true);
            }
        }

        function gameOver(isWin) {
            gameActive = false;
            clearInterval(timer);

            if (!isWin) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (board[r][c].isMine) {
                            const div = document.getElementById(`cell-${r}-${c}`);
                            div.classList.add('revealed', 'mine');
                            div.innerHTML = '☢';
                        }
                    }
                }
                modalTitle.textContent = "SYSTEM FAILURE";
                modalTitle.className = "text-4xl font-bold mb-4 glitch-text italic text-red-500";
                modalDesc.textContent = "Critical detonation detected. Neural link severed.";
            } else {
                modalTitle.textContent = "THREAT CLEARED";
                modalTitle.className = "text-4xl font-bold mb-4 glitch-text italic text-cyan-400";
                modalDesc.textContent = `Sector secured in ${seconds} seconds. Superior tactical efficiency.`;
            }

            setTimeout(() => modal.classList.remove('hidden'), 500);
        }

        resetBtn.addEventListener('click', initGame);
        window.onload = initGame;
    </script>
</body>
</html>
