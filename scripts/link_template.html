<a href="{{ FILENAME }}" class="tool-card block p-5 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow border border-gray-200 group" data-title="{{ TITLE }}">
    <div class="flex items-start justify-between gap-3 mb-2">
        <h2 class="text-lg font-semibold text-gray-800 group-hover:text-blue-600 transition-colors">{{ TITLE }}</h2>
        <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-600 transition-colors flex-shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
    <p class="text-gray-500 text-sm leading-relaxed mb-3">{{ DESCRIPTION }}</p>
    <div class="tool-meta">{{ META_HTML }}</div>
    <div class="tool-footer mt-3 pt-3 border-t border-gray-100 flex justify-between items-center text-xs text-gray-400">
        <span class="font-mono">{{ FILENAME }}</span>
        {{ LAST_UPDATED }}
    </div>
</a>
